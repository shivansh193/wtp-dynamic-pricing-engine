# Render blueprint - one API web service + managed Postgres + managed Redis.
# The frontend deploys to Vercel (see dashboard/vercel.json and the README).
services:
  - type: web
    name: wtp-pricing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: standard          # LightGBM training on first boot needs ~1GB RAM
    healthCheckPath: /health
    startCommand: bash scripts/start.sh
    envVars:
      - key: PORT
        value: "8000"
      - key: SYNTHETIC_ROWS
        value: "20000"
      - key: TRAIN_FAST
        value: "1"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: DB_REQUIRED
        value: "false"
      - key: CORS_ALLOW_ALL
        value: "true"        # tighten to your Vercel domain once known
      - key: PUBLIC_BASE_URL
        sync: false          # set to your Vercel URL, e.g. https://razorpay-wtp.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: wtp-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wtp-redis
          property: connectionString

databases:
  - name: wtp-postgres
    plan: basic-256mb

  - name: wtp-redis
    type: keyvalue
    plan: free
    ipAllowList: []
