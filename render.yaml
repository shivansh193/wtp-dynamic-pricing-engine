# Render Blueprint - free single web service, no managed datastores.
#
# Deploy:
#   1. render.com -> sign in with GitHub (no card needed for the free web tier)
#   2. New +  ->  Blueprint  ->  pick the wtp-dynamic-pricing-engine repo  ->  Apply
#   3. after the first deploy, set PUBLIC_BASE_URL to your Vercel URL and redeploy
#
# The API self-seeds on first boot (offline data + fast train, ~2 min) and then
# degrades gracefully to in-memory stores - no Postgres/Redis required for the
# demo. Add Render Key Value + Postgres later and set REDIS_URL / DATABASE_URL
# if you want persistence.
#
# Free instances sleep after 15 min idle and cold-start in ~50 s. For a live
# panel demo, hit the URL once a few minutes beforehand to warm it, or bump the
# plan to "starter" for always-on.
services:
  - type: web
    name: wtp-pricing-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /health
    envVars:
      - key: SYNTHETIC_ROWS
        value: "20000"
      - key: TRAIN_FAST
        value: "1"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: DB_REQUIRED
        value: "false"
      - key: CORS_ALLOW_ALL
        value: "true"          # or leave unset - *.vercel.app is allowed by default
      - key: PUBLIC_BASE_URL
        sync: false             # set to your Vercel URL after the first deploy
